name: Build iPhone IPA

on:
  workflow_dispatch:
  push:
    paths:
      - STANDOFF3_GITHUB_SOURCE.zip
      - .github/workflows/ios-ipa.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract source
        run: unzip -q STANDOFF3_GITHUB_SOURCE.zip
      - name: Install dependencies and check game
        working-directory: cs-tactical
        run: |
          npm install --no-audit --no-fund
          npm run check
      - name: Prepare iOS project
        working-directory: cs-tactical/ios-build
        run: |
          npm install --no-audit --no-fund
          node sync-web.mjs
          npx cap add ios
          npx cap sync ios
      - name: Build iPhone app and package IPA
        working-directory: cs-tactical/ios-build
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" build
          test -f build/Build/Products/Release-iphoneos/App.app/App
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/App.app
          zip -qry Standoff3Reborn-unsigned.ipa Payload
          unzip -t Standoff3Reborn-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Standoff3Reborn-unsigned-ipa
          path: cs-tactical/ios-build/Standoff3Reborn-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
